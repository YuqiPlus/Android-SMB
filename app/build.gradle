import javax.inject.Inject
import org.gradle.process.ExecOperations

plugins {
    id 'com.android.application' version '9.3.0'
}

abstract class BuildSmbEngine extends DefaultTask {
    @InputDirectory
    @PathSensitive(PathSensitivity.RELATIVE)
    abstract DirectoryProperty getEngineDirectory()

    @OutputDirectory
    abstract DirectoryProperty getOutputDirectory()

    @Input
    abstract Property<String> getGoCommand()

    @Inject
    abstract ExecOperations getExecOperations()

    @TaskAction
    void buildEngine() {
        def output = outputDirectory.file('arm64-v8a/libsmbserver.so').get().asFile
        output.parentFile.mkdirs()
        execOperations.exec {
            workingDir engineDirectory.get().asFile
            executable goCommand.get()
            args 'build', '-mod=readonly', '-trimpath', '-buildmode=pie', '-ldflags=-s -w',
                '-o', output.absolutePath, '.'
            environment 'GOOS', 'android'
            environment 'GOARCH', 'arm64'
            environment 'CGO_ENABLED', '0'
        }
    }
}

def localGo = providers.fileContents(rootProject.layout.projectDirectory.file('local.properties'))
    .asText.map { contents ->
        def properties = new Properties()
        properties.load(new StringReader(contents))
        properties.getProperty('androidSmb.go')?.trim()
    }.filter { !it.isEmpty() }

def buildSmbEngine = tasks.register('buildSmbEngine', BuildSmbEngine) {
    engineDirectory.set(rootProject.layout.projectDirectory.dir('engine'))
    outputDirectory.set(layout.buildDirectory.dir('generated/smbEngine'))
    goCommand.set(providers.environmentVariable('ANDROID_SMB_GO').orElse(localGo).orElse('go'))
}

android {
    namespace 'com.yuqiplus.androidsmb'
    compileSdk 37

    defaultConfig {
        applicationId 'com.yuqiplus.androidsmb'
        minSdk 26
        targetSdk 37
        versionCode 4
        versionName '0.1.3'
        ndk.abiFilters 'arm64-v8a'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            vcsInfo.include = false
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
            keepDebugSymbols += ['**/libsmbserver.so']
        }
    }
}

androidComponents {
    onVariants(selector().all()) { variant ->
        variant.sources.jniLibs.addGeneratedSourceDirectory(buildSmbEngine) { it.outputDirectory }
    }
}
